# Ubuntu Core 24.04 base image with PREEMPT_RT and Android kernel module support
# Overrides the variables in noble-rt/config.ini

[build]
# Ubuntu Core 24.04 image for Raspberry Pi
image_url = https://releases.ubuntu.com/24.04/ubuntu-24.04-preinstalled-core-arm64+raspi.img.xz

# Ubuntu Core has single partition layout
image_mounts = /

# Slightly smaller than noble-rt since Core is minimal
image_size = 3G

# The filename of the output image
output_filename = ubuntu-24.04-core-rt-android-arm64+raspi.img

# The host path to the qemu-user-static binary
qemu_user_static_path = /usr/bin/qemu-aarch64-static

[env]
LINUX_RT_VERSION = 6.8.4-rt11
STOCK_LINUX_VERSION = 6.8.0-1018
# Android-specific environment variables
ANDROID_MODULES_ENABLED = 1
