# LSM6DSX overlay profile for noble-rt
# Extends noble-rt with LSM6DSX (CONFIG_IIO_ST_LSM6DSX) sensor module support
# This profile adds IIO sensor infrastructure on top of the PREEMPT_RT Ubuntu Server build

[build]
# Use the same output filename with -lsm6dsx suffix
output_filename = ubuntu-24.04.5-rt-lsm6dsx-arm64+raspi.img

[env]
# Enable LSM6DSX sensor module support
LSM6DSX_MODULE_ENABLED = 1

# Device Tree "compatible" string for the exact chip variant on your board.
# Valid values (from Documentation/devicetree/bindings/iio/imu/st,lsm6dsx.yaml):
# st,lsm6ds3, st,lsm6ds3h, st,lsm6dsl, st,lsm6dsm, st,ism330dlc, st,lsm6dso,
# st,asm330lhh, st,lsm6dsox, st,lsm6dsr, st,lsm6ds3tr-c, st,ism330dhcx, ...
LSM6DSX_COMPATIBLE = st,lsm6dsl

# I2C address of the sensor, without the "0x" prefix (0x6a when SA0/CS is
# tied to GND, 0x6b when tied to VCC).
LSM6DSX_I2C_ADDR = 6a
