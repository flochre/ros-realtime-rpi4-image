# Standalone profile: builds on top of the prebuilt lsm6dsx image, so it does
# not need to be overlaid on noble-rt.
[build]
image_url = https://github.com/flochre/ros-realtime-rpi4-image/releases/download/24.04.5_rt-lsm6dsx/ubuntu-24.04.5-rt-lsm6dsx-arm64+raspi.img.xz
output_filename = ubuntu-24.04.5-rt-cfr-arm64+raspi.img
image_mounts = /boot/firmware,/
image_size = 8G
qemu_user_static_path = /usr/bin/qemu-aarch64-static

[env]
ROS_DISTRO = jazzy

