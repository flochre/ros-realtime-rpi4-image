# QPlatform overlay profile for noble-rt
# Extends noble-rt with QPlatform hardware support (IIO LSM6DSX, I2C/SPI buses, Raspbian driver parity)
# This profile adds hardware infrastructure on top of the PREEMPT_RT Ubuntu Server build

[build]
output_filename = ubuntu-24.04.5-rt-qplatform-arm64+raspi.img

[env]
QPLATFORM_ENABLED = 1
LSM6DSX_MODULE_ENABLED = 1
