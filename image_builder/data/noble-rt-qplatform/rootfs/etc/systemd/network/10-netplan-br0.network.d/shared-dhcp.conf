# ==============================================================================
# systemd-networkd Drop-In for Netplan br0 ("Shared to other computers")
# ==============================================================================
# Enables systemd-networkd's built-in DHCPv4 server and IPv4 NAT masquerading
# on br0 (10.42.0.1/24), serving both Ethernet motor boards and Wi-Fi hotspot clients.
# ==============================================================================
[Network]
DHCPServer=yes
IPForward=ipv4

[DHCPServer]
PoolOffset=10
PoolSize=200
DefaultLeaseTimeSec=3600
MaxLeaseTimeSec=7200
EmitDNS=yes
DNS=10.42.0.1
EmitTimezone=no
EmitRouter=yes
