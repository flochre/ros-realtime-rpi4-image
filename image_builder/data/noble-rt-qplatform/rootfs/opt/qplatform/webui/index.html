<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>QPlatform Robot Kiosk</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 18px 24px;
      gap: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      flex: 1;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .card-value {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--accent);
      margin: 8px 0;
    }
    .card-foot {
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn:active {
      background: var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="dot" id="status-dot"></div>
      <div>
        <h1>QPLATFORM OMNI</h1>
        <div class="subtitle">Ubuntu 24.04 • Linux 6.8 PREEMPT_RT • ROS 2 Jazzy</div>
      </div>
    </div>
    <div id="clock" style="font-size:1.1rem;font-weight:600;color:var(--muted);">--:--:--</div>
  </header>

  <main class="grid">
    <div class="card">
      <div class="card-label">Display Pipeline</div>
      <div class="card-value">Wayland DRM</div>
      <div class="card-foot">Cage Kiosk • Zero X11</div>
    </div>
    <div class="card">
      <div class="card-label">IMU (LSM6DS3TR-C)</div>
      <div class="card-value">SPI0 Active</div>
      <div class="card-foot">hrtimer IIO Buffer</div>
    </div>
    <div class="card">
      <div class="card-label">ROS Bridge</div>
      <div class="card-value" id="ros-state">Standby</div>
      <div class="card-foot" id="ros-url">ws://localhost:9090</div>
    </div>
  </main>

  <footer>
    <span>Configure URL in <code>/etc/default/qplatform-kiosk</code></span>
    <div style="display:flex;gap:8px;">
      <button class="btn" onclick="window.location.href='http://localhost:8080'">Open :8080</button>
      <button class="btn" onclick="window.location.reload()">Reload</button>
    </div>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    function connectRosBridge() {
      const stateEl = document.getElementById('ros-state');
      try {
        const ws = new WebSocket('ws://localhost:9090');
        ws.onopen = () => {
          stateEl.textContent = 'Connected';
          stateEl.style.color = '#22c55e';
        };
        ws.onclose = () => {
          stateEl.textContent = 'Standby';
          stateEl.style.color = '#38bdf8';
          setTimeout(connectRosBridge, 3000);
        };
        ws.onerror = () => ws.close();
      } catch (e) {
        setTimeout(connectRosBridge, 3000);
      }
    }
    connectRosBridge();
  </script>
</body>
</html>
